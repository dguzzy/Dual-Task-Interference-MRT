<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wickens MRT — Cockpit Dual-Task Experiment</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080C12; overflow-x: hidden; }
  button:active { transform: scale(0.97); }
  button:focus { outline: none; }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;


const DURATION = 25000;
const W = 1000, H = 700;
const STICK_GAIN = 0.04;
const DEADZONE = 15;
const ALERT_INTERVAL_MIN = 3200;
const ALERT_INTERVAL_MAX = 5500;
const ALERT_WINDOW = 3000;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ─── Audio ───
let _ac = null;
const ac = () => { if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)(); if (_ac.state === "suspended") _ac.resume(); return _ac; };
const buzz = (dur, pan) => {
  const c = ac(), o = c.createOscillator(), g = c.createGain(), p = c.createStereoPanner();
  o.frequency.value = 340; o.type = "sawtooth";
  g.gain.setValueAtTime(0.22, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  p.pan.value = pan;
  o.connect(g).connect(p).connect(c.destination); o.start(); o.stop(c.currentTime + dur);
};
const playAlarmPanned = (pan) => {
  buzz(0.12, pan);
  setTimeout(() => buzz(0.12, pan), 180);
  setTimeout(() => buzz(0.12, pan), 360);
};
const say = (text) => { const u = new SpeechSynthesisUtterance(text); u.rate = 1.05; u.pitch = 1; speechSynthesis.speak(u); };

// ─── Styles ───
const font = "'Oxanium',monospace";
const btnStyle = (color = "#5EEAD4") => ({
  fontFamily: font, fontSize: 14, fontWeight: 600, letterSpacing: "0.1em",
  background: "transparent", color, border: `1px solid ${color}44`,
  borderRadius: 6, padding: "12px 36px", cursor: "pointer", textTransform: "uppercase", transition: "all 0.15s",
});

// ─── Conditions ───
const CONDITIONS = [
  { id: "vis-spa", label: "Visual–Spatial", color: "#F97353", secondary: "visual-spatial" },
  { id: "vis-ver", label: "Visual–Verbal", color: "#8B7CF6", secondary: "visual-verbal" },
  { id: "aud-ver", label: "Auditory–Verbal", color: "#FBBF24", secondary: "auditory-verbal" },
  { id: "aud-spa", label: "Auditory–Spatial", color: "#F472B6", secondary: "auditory-spatial" },
];

// ─── Scene Drawing ───
function drawSky(ctx, pitch) {
  const hy = H/2+pitch*4;
  const sg = ctx.createLinearGradient(0,Math.min(hy-300,0),0,Math.max(hy,0));
  sg.addColorStop(0,"#0A1628"); sg.addColorStop(0.4,"#14304A"); sg.addColorStop(0.7,"#2A5A6E"); sg.addColorStop(1,"#4A8A9A");
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,Math.max(0,hy));
  const gg = ctx.createLinearGradient(0,Math.max(hy,0),0,H);
  gg.addColorStop(0,"#3A6644"); gg.addColorStop(0.3,"#2D5235"); gg.addColorStop(0.7,"#1E3A24"); gg.addColorStop(1,"#122218");
  ctx.fillStyle = gg; ctx.fillRect(0,Math.max(0,hy),W,H);
}
function drawHorizonLine(ctx, pitch, roll) {
  const hy=H/2+pitch*4, cx=W/2, cy=H/2;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(roll*Math.PI/180); ctx.translate(-cx,-cy);
  ctx.strokeStyle="#5EEAD4"; ctx.lineWidth=1.5; ctx.globalAlpha=0.6;
  ctx.beginPath(); ctx.moveTo(-100,hy); ctx.lineTo(W+100,hy); ctx.stroke(); ctx.globalAlpha=1;
  ctx.strokeStyle="#5EEAD466"; ctx.lineWidth=1; ctx.font=`11px ${font}`; ctx.fillStyle="#5EEAD488"; ctx.textAlign="right";
  for(let d=-20;d<=20;d+=5){if(!d)continue;const y=hy-d*4,hw=d%10===0?60:30;
    ctx.beginPath();ctx.moveTo(cx-hw,y);ctx.lineTo(cx+hw,y);ctx.stroke();
    if(d%10===0)ctx.fillText(`${d}`,cx-hw-6,y+4);}
  ctx.restore();
}
function drawGround(ctx,pitch,roll,elapsed){
  const hy=H/2+pitch*4,sp=elapsed*0.08,vx=W/2+roll*2;
  ctx.save();ctx.strokeStyle="#5EEAD4";ctx.lineWidth=0.5;ctx.globalAlpha=0.15;
  for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(vx,hy);ctx.lineTo(vx+i*200,H+40);ctx.stroke();}
  for(let d=0;d<8;d++){const t=((d*50+sp)%400)/400;ctx.globalAlpha=t*0.3;
    ctx.beginPath();ctx.moveTo(0,hy+t*t*(H-hy+40));ctx.lineTo(W,hy+t*t*(H-hy+40));ctx.stroke();}
  ctx.restore();
}
function drawStars(ctx,pitch){
  ctx.fillStyle="#fff";const s=[.12,.34,.56,.78,.91,.23,.45,.67,.89,.11,.33,.55,.77,.99,.15,.37];
  for(let i=0;i<s.length;i++){const x=(s[i]*3.7*W)%W,y=s[(i+3)%s.length]*H*0.35+pitch*2;
    if(y>0&&y<H/2-30){ctx.globalAlpha=0.3+s[(i+5)%s.length]*0.5;ctx.beginPath();ctx.arc(x,y,0.8+s[i]*0.8,0,Math.PI*2);ctx.fill();}}
  ctx.globalAlpha=1;
}
function drawMountains(ctx,pitch,roll){
  const hy=H/2+pitch*4,sh=roll*1.5;ctx.save();
  ctx.fillStyle="#1A3A2A";ctx.globalAlpha=0.5;ctx.beginPath();ctx.moveTo(-20,hy);
  [[.06,25],[.15,50],[.28,35],[.4,65],[.52,40],[.65,55],[.78,70],[.88,30],[1.02,45]].forEach(([p,h])=>ctx.lineTo(p*W+sh,hy-h));
  ctx.lineTo(W+20,hy);ctx.closePath();ctx.fill();
  ctx.fillStyle="#152E20";ctx.globalAlpha=0.6;ctx.beginPath();ctx.moveTo(-20,hy+5);
  [[.05,15],[.18,35],[.32,20],[.48,45],[.6,25],[.75,38],[.9,22],[1.02,30]].forEach(([p,h])=>ctx.lineTo(p*W+sh*1.5,hy-h+10));
  ctx.lineTo(W+20,hy+5);ctx.closePath();ctx.fill();ctx.restore();
}
function drawFD(ctx,x,y){
  ctx.save();ctx.strokeStyle="#FBBF24";ctx.lineWidth=2.5;ctx.shadowColor="#FBBF24";ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(x-40,y+12);ctx.lineTo(x-8,y);ctx.lineTo(x,y-4);ctx.lineTo(x+8,y);ctx.lineTo(x+40,y+12);ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle="#FBBF24";ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawAircraft(ctx,cx,cy){
  ctx.strokeStyle="#E4E2EE";ctx.lineWidth=2;ctx.fillStyle="#E4E2EE";
  ctx.beginPath();ctx.moveTo(cx-50,cy);ctx.lineTo(cx-14,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+14,cy);ctx.lineTo(cx+50,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-50,cy);ctx.lineTo(cx-50,cy+8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+50,cy);ctx.lineTo(cx+50,cy+8);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,3,0,Math.PI*2);ctx.fill();
}
function drawHUD(ctx,spd,alt,hdg,err,elapsed,dur){
  ctx.save();ctx.font=`13px ${font}`;ctx.fillStyle="#5EEAD4";ctx.globalAlpha=0.85;
  ctx.textAlign="right";ctx.fillText("KTS",70,36);ctx.font=`22px ${font}`;ctx.fillText(Math.round(spd)+"",70,58);
  ctx.font=`13px ${font}`;ctx.textAlign="left";ctx.fillText("ALT",W-70,36);ctx.font=`22px ${font}`;ctx.fillText(Math.round(alt)+"",W-70,58);
  ctx.font=`13px ${font}`;ctx.textAlign="center";ctx.fillText("HDG",W/2,30);ctx.font=`18px ${font}`;
  ctx.fillText(Math.round(hdg).toString().padStart(3,"0")+"°",W/2,50);
  ctx.font=`12px ${font}`;ctx.fillStyle=err<30?"#34D399":err<60?"#FBBF24":"#F87171";ctx.textAlign="center";
  ctx.fillText(`DEV ${Math.round(err)}px`,W/2,H-36);
  const p=elapsed/dur;ctx.fillStyle="#27272F";ctx.fillRect(40,H-16,W-80,5);ctx.fillStyle="#5EEAD4";ctx.fillRect(40,H-16,(W-80)*(1-p),5);
  ctx.strokeStyle="#5EEAD433";ctx.lineWidth=1;const m=16,s=30;
  ctx.beginPath();ctx.moveTo(m,m+s);ctx.lineTo(m,m);ctx.lineTo(m+s,m);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-m-s,m);ctx.lineTo(W-m,m);ctx.lineTo(W-m,m+s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(m,H-m-s);ctx.lineTo(m,H-m);ctx.lineTo(m+s,H-m);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-m-s,H-m);ctx.lineTo(W-m,H-m);ctx.lineTo(W-m,H-m-s);ctx.stroke();
  ctx.restore();
}
function drawStick(ctx,sx,sy){
  const ox=56,oy=H-56,r=28;ctx.save();ctx.globalAlpha=0.35;ctx.strokeStyle="#5EEAD4";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(ox,oy,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox-r,oy);ctx.lineTo(ox+r,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy-r);ctx.lineTo(ox,oy+r);ctx.stroke();
  ctx.globalAlpha=0.9;ctx.fillStyle="#5EEAD4";
  ctx.beginPath();ctx.arc(ox+clamp(sx,-1,1)*(r-4),oy+clamp(sy,-1,1)*(r-4),4,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawScanlines(ctx){ctx.save();ctx.fillStyle="#000";ctx.globalAlpha=0.04;for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);ctx.restore();}

// ─── Secondary Task Visuals (NO on-screen hints, NO key legends) ───

// VISUAL-SPATIAL: Landolt C at a random peripheral position.
// Gap on LEFT side = fire (left-click). Gap on RIGHT side = flare (right-click).
// The ring is small enough (~12px radius) that you MUST foveate it to see the gap direction.
// A subtle outer pulse ring helps you find it, but the gap itself requires direct fixation.
function drawLandoltC(ctx, x, y, isMissile, age) {
  const r = 11; // small enough to require foveal vision for gap discrimination
  const gapAngle = isMissile ? Math.PI : 0; // gap on left = fire, gap on right = flare
  const gapSize = 0.45; // radians (~26 degrees of arc removed)

  // Outer locator pulse — large, faint, helps find the target without revealing the gap
  const pulseR = 28 + Math.sin(age * 6) * 4;
  ctx.save();
  ctx.globalAlpha = 0.2 + Math.sin(age * 6) * 0.1;
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, pulseR, 0, Math.PI * 2); ctx.stroke();

  // The Landolt C itself
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(x, y, r, gapAngle + gapSize / 2, gapAngle + Math.PI * 2 - gapSize / 2);
  ctx.stroke();

  // Small filled center dot to anchor fixation
  ctx.fillStyle = "#FFFFFF";
  ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// VISUAL-VERBAL: Text at a random peripheral position (NOT on the flight director).
// Large, high-contrast text. Amber/gold on dark for optimal legibility against both sky and ground.
function drawVerbalIndicator(ctx, isMissile, x, y, age) {
  const blink = Math.sin(age * 8) > -0.3;
  ctx.save();

  // Dark backing pill for contrast against any background
  const text = isMissile ? "MISSILE" : "FLARE";
  ctx.font = `bold 28px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const metrics = ctx.measureText(text);
  const pw = metrics.width + 24, ph = 40;
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.beginPath();
  ctx.roundRect(x - pw/2, y - ph/2, pw, ph, 8);
  ctx.fill();

  // Text in amber — high contrast on the dark pill, visible against any scene background
  ctx.fillStyle = blink ? "#FFD666" : "#FFD66688";
  ctx.fillText(text, x, y);

  ctx.restore();
}

// ─── Flight path ───
function useFlightPath() {
  return useCallback((elapsed) => {
    const t = elapsed / 1000;
    return {
      fdX: W/2
        + Math.sin(t*0.61)*87.5
        + Math.sin(t*1.37+0.8)*56
        + Math.sin(t*2.53+2.1)*37.5
        + Math.sin(t*3.71+4.2)*22.5
        + Math.sin(t*5.09+1.4)*12.5,
      fdY: H/2
        + Math.sin(t*0.53+0.3)*69
        + Math.sin(t*1.19+1.7)*44
        + Math.sin(t*2.17+3.3)*27.5
        + Math.sin(t*3.43+0.6)*17.5
        + Math.sin(t*4.79+2.8)*10,
      speed: 240+Math.sin(t*.4)*15,
      alt: 3500+Math.sin(t*.2)*200+Math.cos(t*.5)*100,
      heading: (270+Math.sin(t*.15)*20+360)%360,
    };
  }, []);
}

// ─── Trial ───
function Trial({ condition, onDone, duration = DURATION, isPractice = false }) {
  const canvasRef = useRef(null);
  const updatePath = useFlightPath();
  const posRef = useRef({x:W/2,y:H/2});
  const stickRef = useRef({x:W/2,y:H/2});
  const samplesRef = useRef([]);
  const flyingRef = useRef(false);
  const startTimeRef = useRef(0);
  const alertRef = useRef({
    active:false, isMissile:false, born:0, nextSpawn:0,
    hits:0, total:0, responded:false,
    feedbackUntil:0, feedbackCorrect:false,
    alertX:0, alertY:0,
  });
  const [phase, setPhase] = useState("countdown");
  const [count, setCount] = useState(3);
  const [result, setResult] = useState(null);

  // Countdown
  useEffect(()=>{
    if(phase!=="countdown")return;
    if(count>0){const t=setTimeout(()=>setCount(c=>c-1),1000);return()=>clearTimeout(t);}
    else{
      setPhase("flying"); flyingRef.current=true; startTimeRef.current=performance.now();
      samplesRef.current=[]; posRef.current={x:W/2,y:H/2}; stickRef.current={x:W/2,y:H/2};
      const a=alertRef.current; a.active=false; a.hits=0; a.total=0;
      a.nextSpawn=performance.now()+2500; a.responded=false; a.feedbackUntil=0;
    }
  },[phase,count]);

  // Mouse
  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const onMove=e=>{const r=canvas.getBoundingClientRect();stickRef.current={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};};
    const onLeave=()=>{stickRef.current={x:W/2,y:H/2};};
    const onTouch=e=>{e.preventDefault();const t=e.touches[0],r=canvas.getBoundingClientRect();stickRef.current={x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height};};
    const onTouchEnd=()=>{stickRef.current={x:W/2,y:H/2};};
    canvas.addEventListener("mousemove",onMove); canvas.addEventListener("mouseleave",onLeave);
    canvas.addEventListener("touchmove",onTouch,{passive:false}); canvas.addEventListener("touchstart",onTouch,{passive:false}); canvas.addEventListener("touchend",onTouchEnd);
    return()=>{canvas.removeEventListener("mousemove",onMove);canvas.removeEventListener("mouseleave",onLeave);
      canvas.removeEventListener("touchmove",onTouch);canvas.removeEventListener("touchstart",onTouch);canvas.removeEventListener("touchend",onTouchEnd);};
  },[]);

  // Click response — LEFT click = fire, RIGHT click = flare
  useEffect(()=>{
    const canvas = canvasRef.current; if(!canvas) return;
    const onClick = (e) => {
      const a = alertRef.current;
      if (!a.active || a.responded) return;
      // button 0 = left click, button 2 = right click
      const clickedMissile = e.button === 0;
      const clickedFlare = e.button === 2;
      if (!clickedMissile && !clickedFlare) return;

      a.responded = true;
      const correct = (clickedMissile && a.isMissile) || (clickedFlare && !a.isMissile);
      if (correct) a.hits++;
      a.feedbackUntil = performance.now() + 500;
      a.feedbackCorrect = correct;
    };
    const onContext = (e) => { e.preventDefault(); }; // prevent right-click menu
    canvas.addEventListener("mousedown", onClick);
    canvas.addEventListener("contextmenu", onContext);
    return () => { canvas.removeEventListener("mousedown", onClick); canvas.removeEventListener("contextmenu", onContext); };
  },[]);

  // Spawn alert
  function spawnAlert(now, secondary) {
    const a = alertRef.current;
    a.active = true; a.born = now; a.responded = false; a.total++;
    a.isMissile = Math.random() > 0.5;

    if (secondary === "visual-spatial" || secondary === "visual-verbal") {
      // Place indicator at a random peripheral position, at least 180px from center
      let lx, ly, attempts = 0;
      do {
        lx = 80 + Math.random() * (W - 160);
        ly = 80 + Math.random() * (H - 160);
        attempts++;
      } while (Math.hypot(lx - W/2, ly - H/2) < 180 && attempts < 20);
      a.alertX = lx;
      a.alertY = ly;
    } else if (secondary === "auditory-verbal") {
      say(a.isMissile ? "missile" : "flare");
    } else if (secondary === "auditory-spatial") {
      // Missile = left ear, Flare = right ear
      const pan = a.isMissile ? -1.0 : 1.0;
      playAlarmPanned(pan);
    }
    // Visual tasks are drawn per-frame, no spawn action needed

    a.nextSpawn = now + ALERT_INTERVAL_MIN + Math.random() * (ALERT_INTERVAL_MAX - ALERT_INTERVAL_MIN);
  }

  // Animation
  useEffect(()=>{
    if(phase!=="flying")return;
    const canvas=canvasRef.current; if(!canvas)return;
    const ctx=canvas.getContext("2d"); let animId;

    function frame(){
      if(!flyingRef.current)return;
      const now=performance.now(), elapsed=now-startTimeRef.current;

      if(elapsed>duration){
        flyingRef.current=false;
        const avg=samplesRef.current.length>0?samplesRef.current.reduce((a,b)=>a+b,0)/samplesRef.current.length:999;
        const a=alertRef.current;
        setResult({avgError:Math.round(avg*10)/10, alertHits:a.hits, alertTotal:a.total});
        setPhase("done"); return;
      }

      // Stick physics
      const sx=stickRef.current.x-W/2, sy=stickRef.current.y-H/2, mag=Math.hypot(sx,sy);
      if(mag>DEADZONE){const eff=(mag-DEADZONE)*STICK_GAIN,ang=Math.atan2(sy,sx);
        posRef.current.x+=Math.cos(ang)*eff; posRef.current.y+=Math.sin(ang)*eff;}
      posRef.current.x+=(W/2-posRef.current.x)*0.003; posRef.current.y+=(H/2-posRef.current.y)*0.003;
      posRef.current.x=clamp(posRef.current.x,20,W-20); posRef.current.y=clamp(posRef.current.y,20,H-20);

      const fp=updatePath(elapsed), px=posRef.current.x, py=posRef.current.y;
      const err=Math.hypot(px-fp.fdX,py-fp.fdY);
      samplesRef.current.push(err);
      const pitch=(py-H/2)*0.08, roll=(px-W/2)*0.04;
      const snx=mag>DEADZONE?(sx/mag)*((mag-DEADZONE)/150):0, sny=mag>DEADZONE?(sy/mag)*((mag-DEADZONE)/150):0;

      // Alert logic
      const a=alertRef.current, sec=condition.secondary;
      if(a.active&&!a.responded&&now-a.born>ALERT_WINDOW){a.responded=true;a.feedbackUntil=now+400;a.feedbackCorrect=false;}
      if(a.active&&a.responded&&now>a.feedbackUntil){a.active=false;}
      if(sec&&!a.active&&now>a.nextSpawn){spawnAlert(now,sec);}

      // Draw
      ctx.clearRect(0,0,W,H);
      drawSky(ctx,pitch); drawStars(ctx,pitch); drawMountains(ctx,pitch,roll);
      drawGround(ctx,pitch,roll,elapsed); drawHorizonLine(ctx,pitch,roll);
      drawFD(ctx,fp.fdX,fp.fdY);

      // Secondary visuals
      if(sec==="visual-spatial"&&a.active&&!a.responded)
        drawLandoltC(ctx, a.alertX, a.alertY, a.isMissile, (now-a.born)/1000);
      if(sec==="visual-verbal"&&a.active&&!a.responded)
        drawVerbalIndicator(ctx, a.isMissile, a.alertX, a.alertY, (now-a.born)/1000);

      // Feedback
      if(a.active&&a.responded&&now<a.feedbackUntil){
        ctx.save(); ctx.font=`bold 14px ${font}`; ctx.textAlign="center";
        ctx.fillStyle=a.feedbackCorrect?"#34D399":"#F87171";
        ctx.fillText(a.feedbackCorrect?"CONFIRMED":"WRONG",W/2,H-56);
        ctx.restore();
      }

      drawAircraft(ctx,px,py);
      drawHUD(ctx,fp.speed,fp.alt,fp.heading,err,elapsed,duration);
      drawStick(ctx,snx,sny);
      drawScanlines(ctx);
      animId=requestAnimationFrame(frame);
    }
    animId=requestAnimationFrame(frame);
    return()=>{cancelAnimationFrame(animId);flyingRef.current=false;};
  },[phase,condition,updatePath]);

  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
      <div style={{fontSize:13,color:condition.color,fontWeight:600}}>{isPractice ? `Practice — ${condition.label}` : condition.label}</div>
      <div style={{position:"relative"}}>
        <canvas ref={canvasRef} width={W} height={H} style={{
          width:"100%",maxWidth:W,aspectRatio:`${W}/${H}`,borderRadius:8,
          border:"1px solid #1A2A30",cursor:phase==="flying"?"crosshair":"default",
        }}/>
        {phase==="countdown"&&(
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(8,12,18,0.85)",borderRadius:8}}>
            <span style={{fontSize:64,fontWeight:700,color:condition.color,fontFamily:font}}>{count>0?count:"FLY"}</span>
          </div>)}
        {phase==="done"&&result&&(
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(8,12,18,0.88)",borderRadius:8}}>
            <div style={{fontSize:12,letterSpacing:"0.12em",color:"#5EEAD488",textTransform:"uppercase",marginBottom:10}}>
              {isPractice ? "Practice complete" : `${condition.label} complete`}
            </div>
            <div style={{fontSize:13,color:"#7E7C92",marginBottom:4}}>Tracking error</div>

        }}>

// ─── Shuffle helper ───
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

              Keep them aligned with the <span style={{color:"#FBBF24",fontWeight:600}}>gold flight director (V shape)</span>.
            </div>
            <div style={{fontSize:13,color:"#7E7C92",marginTop:10}}>
              Mouse at center = no input. Mouse off-screen = auto-centers.
              Your tracking error (deviation in pixels) is shown at the bottom of the HUD.
            </div>
          </div>
          <div style={{fontSize:13,color:"#7E7C92",marginBottom:20}}>
            This practice is {PRACTICE_DURATION/1000} seconds — just tracking, no alerts. Score is not recorded.
          </div>
          <button onClick={()=>setScreen("practice-trial")} style={btnStyle()}
            onMouseEnter={e=>e.target.style.background="#5EEAD411"}
            onMouseLeave={e=>e.target.style.background="transparent"}
          >Start practice flight</button>
        </div>
      )}

      {screen==="practice-trial"&&(
        <Trial
          key="practice"
          condition={PRACTICE_CONDITION}
          onDone={handlePracticeDone}
          duration={PRACTICE_DURATION}
          isPractice
        />
      )}

      {screen==="practice-done"&&(
        <div style={{textAlign:"center",maxWidth:720,padding:"40px 0"}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:"0.15em",color:"#5EEAD488",textTransform:"uppercase",marginBottom:10}}>
            Practice complete</div>
          <div style={{fontSize:22,fontWeight:700,color:"#5EEAD4",marginBottom:12}}>
            Ready for the experiment</div>
          <div style={{fontSize:14,color:"#7E7C92",lineHeight:1.8,marginBottom:12}}>
            Now you'll fly 4 real trials of {DURATION/1000} seconds each. Before each trial you'll get
            a briefing and a short {CONDITION_PRACTICE_DURATION/1000}-second practice with that alert type.
            The order has been <span style={{color:"#E4E2EE",fontWeight:600}}>randomized</span> for this session.
          </div>
          <div style={{fontSize:13,color:"#7E7C92",marginBottom:8}}>
            Trial order:
          </div>
          <div style={{background:"#141419",border:"1px solid #27272F",borderRadius:10,padding:14,marginBottom:24,textAlign:"left"}}>
            {trialOrder.map((c,i)=>(
              <div key={c.id} style={{display:"flex",gap:8,marginBottom:i<trialOrder.length-1?6:0,alignItems:"baseline"}}>
                <span style={{color:c.color,fontWeight:700,minWidth:16,fontFamily:font,fontSize:13}}>{i+1}.</span>
                <span style={{color:c.color,fontWeight:600,fontSize:13}}>{c.label}</span>
              </div>
            ))}
          </div>
          <button onClick={startExperiment} style={btnStyle()}
            onMouseEnter={e=>e.target.style.background="#5EEAD411"}
            onMouseLeave={e=>e.target.style.background="transparent"}
          >Start experiment</button>
        </div>
      )}

      {screen==="briefing"&&(
        <Briefing condition={trialOrder[condIdx]} condIdx={condIdx} total={trialOrder.length} onReady={()=>setScreen("cond-practice")}/>
      )}

      {screen==="cond-practice"&&(
        <Trial
          key={`cp-${trialOrder[condIdx].id}`}
          condition={trialOrder[condIdx]}
          onDone={handleCondPracticeDone}
          duration={CONDITION_PRACTICE_DURATION}
          isPractice
        />
      )}

      {screen==="pre-real"&&(
        <div style={{textAlign:"center",padding:"48px 0"}}>
          <div style={{fontSize:13,color:"#7E7C92",marginBottom:6}}>Practice done — now the real trial</div>
          <div style={{fontSize:20,fontWeight:700,color:trialOrder[condIdx].color,marginBottom:8}}>
            {trialOrder[condIdx].label}
          </div>
          <div style={{fontSize:14,color:"#7E7C92",marginBottom:24}}>
            This one counts. {DURATION/1000} seconds. Same alert type you just practiced.
          </div>
          <button onClick={()=>setScreen("trial")} style={btnStyle(trialOrder[condIdx].color)}
            onMouseEnter={e=>e.target.style.background=`${trialOrder[condIdx].color}11`}
            onMouseLeave={e=>e.target.style.background="transparent"}
          >Start real trial</button>
        </div>
      )}

      {screen==="trial"&&(
        <Trial key={trialOrder[condIdx].id} condition={trialOrder[condIdx]} onDone={handleDone}/>
      )}

      {screen==="tlx"&&(
        <NasaTLX condition={trialOrder[condIdx]} onSubmit={handleTLX}/>
      )}

      {screen==="results"&&<Results data={data} onRestart={restart}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
